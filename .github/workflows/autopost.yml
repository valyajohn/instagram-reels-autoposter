name: Instagram Reels AutoPost

on:
  schedule:
    # Запуск каждый час (в 00 минут каждого часа по UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-autopost
  cancel-in-progress: false

jobs:
  publish-next-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next video from Google Drive to Instagram
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HASHTAGS: ${{ secrets.IG_HASHTAGS }}
          DEFAULT_HASHTAGS: "#reels #reelsinstagram #viral #viralreels #trending #trendingreels #explore #explorepage #fyp #foryou #instagood #mood #dance #dancing #dancevideo #dancereels #dancevibes #moves #choreo #dancechallenge #groove #dancer #lipsync #lipsyncchallenge #singing #songvibes #musicvibes #vibe #soundon #lipdub #trendingaudio #singalong #beauty #beautytips #glam #aesthetic #glowup #pretty #fashion #style #ootd #lookbook #modelvibes #naturalbeauty"
          RANDOM_HASHTAGS: "true"
          HASHTAGS_COUNT: "8"
          IG_FIRST_COMMENT: ${{ secrets.IG_FIRST_COMMENT }}
          DEFAULT_FIRST_COMMENT: "Больше видео в нашем Telegram — ссылка в шапке профиля 👆 (или stage_style_media)"
          SORT_ORDER: "random"
          CLEAN_UNDERSCORES: "false"
        run: node scripts/autopost.mjs

      - name: Commit updated posted_videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_videos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark published video in posted_videos.json"
            git push
          else
            echo "No changes to posted_videos.json"
          fi
