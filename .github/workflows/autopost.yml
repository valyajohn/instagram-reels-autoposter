name: Instagram Reels AutoPost

on:
  schedule:
    # Каждый 1 час
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-autopost
  cancel-in-progress: false

jobs:
  publish-next-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next video from Google Drive to Instagram
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HASHTAGS: ${{ secrets.IG_HASHTAGS || '' }}
          IG_FIRST_COMMENT: ${{ secrets.IG_FIRST_COMMENT || 'больше  в тг - https://t.me/stage_style_media' }}
          SORT_ORDER: 'name_asc'
          CLEAN_UNDERSCORES: 'true'
        run: node scripts/autopost.mjs

      - name: Commit updated posted_videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_videos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark published video in posted_videos.json"
            git push
          else
            echo "No changes to posted_videos.json"
          fi
